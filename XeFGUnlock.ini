; XeFGUnlock.ini — config for XeFGUnlock.asi (OptiScaler ASI plugin).
; Place next to XeFGUnlock.asi in OptiScaler's plugins/ folder.
; Stock OptiScaler is required; no OptiScaler rebuild or file edit is needed.
; A restart applies any change here.

[XeFG]
; Master toggle. false = change no bytes at all (provider runs as shipped).
UnlockMFG=true

; Reported ceiling on interpolated frames, N (1..5, default 5).
; The in-game multiplier is N+1: 1 = 2X ... 5 = 6X. Default 5 offers every mode.
; Out-of-range values fall back to 5. 1 disables all patching entirely.
MaxInterpolatedFrames=5

; Extra pacing. Spaces out the generated frames of a burst instead of letting
; them arrive together, which is what makes 3X..6X feel like 3X..6X rather than
; a 2X with judder. Generated frames are handed to the provider's own scheduler
; where its state allows, and held on the wall clock otherwise.
; Only takes effect above 2X. Default true; false = no thunk is hooked at all.
; If the provider build is not the one this ASI knows, pacing quietly does
; nothing and the unlock is unaffected.
ExtraPacing=true
